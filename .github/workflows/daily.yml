name: daily-report

# 每天 UTC 00:00（北京时间 08:00）自动运行；也可在 Actions 页面手动触发
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # 提交生成的报告与数据库
  pages: write      # 发布 GitHub Pages
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install requests

      - name: 抓取并生成今日报告
        env:
          # 可选：在仓库 Settings → Secrets 中配置，云端启用 LLM 翻译
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python main.py --once

      - name: 提交报告与数据库（保留跨天状态）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ reports/
          # 1) 本次如有变更，先提交
          git diff --cached --quiet || git commit -m "📰 每日报告 $(date -u +%F)"
          # 2) 拉取云端新提交（手工推送过代码时会有发散）。
          #    关键：db 与 reports/ 是本次工作流生成的结果，应以本地（ours）为胜，
          #    否则 rebase 合并这两个二进制/生成文件会失败。
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            # --strategy-option=ours 让本次生成的文件永远覆盖云端版本
            git rebase --strategy-option=ours origin/main || {
              echo "::error::git rebase 失败，请保留日志排查"
              exit 1
            }
          fi
          git push

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports

      - name: 发布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
